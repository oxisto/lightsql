name: Copilot review

# Requests a Copilot code review on every pull request.
#
# This is a workflow rather than a repository ruleset because the ruleset
# pull_request rule does not accept automatic_copilot_code_review_enabled here:
# the API takes the field and drops it silently, so the setting never persists.
# If that changes, this workflow should be deleted in favour of the rule, which
# would also cover pull requests from forks.

# synchronize fires on every push to an open pull request. Without it a review
# covers only the commits present when the pull request was opened, and any
# later push — including the one that addresses the review — merges unreviewed.
# That is not hypothetical: #14 merged with its last two commits never looked at,
# because a rebase moved the head after the single review had been submitted.
on:
  pull_request:
    types: [opened, reopened, ready_for_review, synchronize]

permissions:
  contents: read
  pull-requests: write

# Several pushes in quick succession would otherwise each ask for a review, and
# the earlier ones would be for commits that no longer exist. Cancelling the
# superseded runs means the request that survives is the one for the head that
# is actually there.
concurrency:
  group: copilot-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  request:
    name: request review
    # A draft is not ready to be reviewed, and Copilot's own review would be
    # stale by the time it is.
    #
    # Fork pull requests are skipped rather than attempted. On the pull_request
    # event their token is read-only, so the POST below would fail with 403 and
    # leave a red check on a contribution that did nothing wrong.
    if: >-
      github.event.pull_request.draft == false &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Request a review from Copilot
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          # The endpoint answers 200 whether or not the reviewer was actually
          # added — an unavailable reviewer is dropped without an error. So a
          # green run here means "asked", not "will review", and the review
          # itself arrives a few minutes later if at all. Do not treat this job
          # as evidence that a review happened.
          gh api --method POST \
            "repos/$REPO/pulls/$PR/requested_reviewers" \
            -f 'reviewers[]=copilot-pull-request-reviewer[bot]'

          # Spelled as an explicit length check rather than `.[] .login // "…"`.
          # The `//` form does work — it is a stream-level alternative, so an
          # empty left side yields the right side — but relying on that is
          # subtle enough that a reader can reasonably doubt it, and this
          # message exists precisely to make a silent no-op unmistakable.
          echo "Requested. Reviewers now on the pull request:"
          gh api "repos/$REPO/pulls/$PR" \
            --jq 'if (.requested_reviewers | length) == 0
                  then "  none — the request was dropped, so no review is coming"
                  else (.requested_reviewers[] | "  " + .login) end'
